name: PR checks

on:
  push:
    branches:
      - codex/m72-editor-panel-text-editing
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Package dry run
        run: npm pack --dry-run

      - name: Release check
        run: npm run release:check

      - name: Diff check
        run: git diff --check
